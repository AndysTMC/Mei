[project]
name = "mei-runtime"
version = "0.1.0"
description = "Mei agent runtime: the user service behind the Mei GNOME Shell extension"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
    # Pinned: mei.ipc.dbus_patch fixes an EAGAIN bug in exactly this version (ADR 0003).
    "dbus-fast==5.2.0",
    "httpx>=0.28,<1",
    "msgspec>=0.19,<1",
]

[project.scripts]
mei-runtime = "mei.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mei"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
