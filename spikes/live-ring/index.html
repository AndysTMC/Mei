<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live ring</title>
<meta name="description" content="Mock-up of the Live conversation ring: listening, waiting, thinking and speaking, in monochrome.">
<style>
  /* Mock-up only. The voice level is simulated: nothing here opens the microphone or plays sound. */
  :root {
    --bg: #fafafa;
    --fg: #1d1d1f;
    --muted: rgba(29, 29, 31, 0.56);
    --surface: rgba(29, 29, 31, 0.06);
    --surface-hover: rgba(29, 29, 31, 0.10);
    --hairline: rgba(29, 29, 31, 0.12);
    --selected-bg: #ffffff;
    --selected-shadow: 0 1px 3px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212;
      --fg: #f5f5f7;
      --muted: rgba(245, 245, 247, 0.56);
      --surface: rgba(245, 245, 247, 0.07);
      --surface-hover: rgba(245, 245, 247, 0.12);
      --hairline: rgba(245, 245, 247, 0.12);
      --selected-bg: rgba(245, 245, 247, 0.16);
      --selected-shadow: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212;
    --fg: #f5f5f7;
    --muted: rgba(245, 245, 247, 0.56);
    --surface: rgba(245, 245, 247, 0.07);
    --surface-hover: rgba(245, 245, 247, 0.12);
    --hairline: rgba(245, 245, 247, 0.12);
    --selected-bg: rgba(245, 245, 247, 0.16);
    --selected-shadow: none;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.4 system-ui, -apple-system, "Cantarell", "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-rows: auto 1fr auto;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  header {
    display: flex;
    justify-content: flex-end;
    padding: 16px;
  }

  .icon-button {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 50%;
    background: var(--surface);
    color: var(--fg);
    display: inline-grid;
    place-items: center;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }
  .icon-button:hover { background: var(--surface-hover); }
  .icon-button:focus-visible, .segmented button:focus-visible, input:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
  }
  .icon-button svg { width: 16px; height: 16px; fill: currentColor; }

  /* The stage: what Live itself would show. */
  main {
    display: grid;
    place-items: center;
    align-content: center;
    gap: 20px;
    padding: 0 16px;
    min-height: 0;
  }
  .ring-wrap {
    width: min(320px, 72vw, 46vh);
    aspect-ratio: 1;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .status {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
    letter-spacing: 0.01em;
    min-height: 1.4em;
    transition: opacity 0.3s ease;
  }
  .status.fading { opacity: 0; }

  /* Review controls: not product UI, only for switching states in this mock-up. */
  footer {
    display: grid;
    justify-items: center;
    gap: 14px;
    padding: 16px 16px 28px;
  }
  .segmented {
    display: inline-flex;
    padding: 3px;
    gap: 2px;
    border-radius: 10px;
    background: var(--surface);
    max-width: 100%;
  }
  .segmented button {
    border: 0;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.2s ease, box-shadow 0.2s ease;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--selected-bg);
    box-shadow: var(--selected-shadow);
    font-weight: 500;
  }
  @media (max-width: 380px) {
    .segmented button { padding: 6px 9px; }
  }

  .level {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--muted);
    min-height: 24px;
    visibility: hidden;
  }
  .level.shown { visibility: visible; }
  .level label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .level input[type="range"] { width: 140px; accent-color: var(--fg); }
  .level input[type="checkbox"] { accent-color: var(--fg); margin: 0; }
  .level svg { width: 16px; height: 16px; fill: currentColor; }
</style>
</head>
<body>
<header>
  <button class="icon-button" id="theme" type="button" aria-label="Switch to dark appearance" title="Appearance">
    <!-- Adwaita weather-clear-night-symbolic / weather-clear-symbolic -->
    <svg id="theme-icon" viewBox="0 0 16 16" aria-hidden="true"></svg>
  </button>
</header>

<main>
  <div class="ring-wrap"><canvas id="ring" role="img" aria-label="Live ring"></canvas></div>
  <p class="status" id="status" aria-live="polite">Listening</p>
</main>

<footer>
  <div class="level" id="level-row">
    <!-- Adwaita audio-input-microphone-symbolic -->
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m 8 0 c -1.660156 0 -3 1.339844 -3 3 v 5 c 0 1.660156 1.339844 3 3 3 s 3 -1.339844 3 -3 v -5 c 0 -1.660156 -1.339844 -3 -3 -3 z m -6 6 v 2.011719 c 0 2.964843 2.164062 5.429687 5 5.90625 v 2.082031 h 2 v -2.082031 c 2.835938 -0.476563 5 -2.941407 5 -5.90625 v -2.011719 h -1.5 v 2.011719 c 0 2.5 -1.992188 4.488281 -4.5 4.488281 s -4.5 -1.988281 -4.5 -4.488281 v -2.011719 z"/></svg>
    <input id="level" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Simulated voice level" disabled>
    <label><input id="auto" type="checkbox" checked> Simulated voice</label>
  </div>
  <div class="segmented" role="group" aria-label="State">
    <button type="button" data-state="listening" aria-pressed="true">Listening</button>
    <button type="button" data-state="waiting" aria-pressed="false">Waiting</button>
    <button type="button" data-state="thinking" aria-pressed="false">Thinking</button>
    <button type="button" data-state="speaking" aria-pressed="false">Speaking</button>
  </div>
</footer>

<script>
"use strict";

// Adwaita symbolic paths, inlined so the page stands alone.
const ICONS = {
  moon: "m 0.917969 8.003906 c 0 3.910156 3.167969 7.078125 7.078125 7.078125 c 3.597656 -0.007812 6.621094 -2.710937 7.023437 -6.285156 c 0.042969 -0.378906 -0.136719 -0.75 -0.457031 -0.957031 c -0.324219 -0.203125 -0.738281 -0.207032 -1.0625 -0.003906 c -0.609375 0.375 -1.316406 0.578124 -2.03125 0.578124 c -2.15625 0 -3.882812 -1.726562 -3.882812 -3.882812 c 0 -0.714844 0.203124 -1.421875 0.578124 -2.03125 c 0.203126 -0.324219 0.199219 -0.738281 -0.003906 -1.0625 c -0.207031 -0.320312 -0.578125 -0.5 -0.957031 -0.457031 c -3.574219 0.402343 -6.277344 3.425781 -6.285156 7.023437 z m 4.667969 -3.472656 c 0 3.25 2.632812 5.882812 5.886718 5.882812 c 1.085938 0 2.152344 -0.304687 3.078125 -0.878906 l -1.519531 -0.960937 c -0.289062 2.570312 -2.449219 4.503906 -5.035156 4.507812 c -2.816406 0 -5.078125 -2.261719 -5.078125 -5.078125 c 0.003906 -2.585937 1.9375 -4.746094 4.507812 -5.035156 l -0.960937 -1.519531 c -0.574219 0.925781 -0.875 1.992187 -0.878906 3.082031 z",
  sun: "m 15 7 h -1 c -0.550781 0 -1 0.449219 -1 1 s 0.449219 1 1 1 h 1 c 0.550781 0 1 -0.449219 1 -1 s -0.449219 -1 -1 -1 z m -2.753906 -4.660156 l -0.707032 0.707031 c -0.390624 0.390625 -0.390624 1.023437 0 1.414063 c 0.390626 0.390624 1.023438 0.390624 1.414063 0 l 0.707031 -0.707032 c 0.390625 -0.390625 0.390625 -1.023437 0 -1.414062 s -1.023437 -0.390625 -1.414062 0 z m -5.242188 -1.347656 v 1 c 0 0.550781 0.449219 1 1 1 c 0.554688 0 1 -0.449219 1 -1 v -1 c 0 -0.554688 -0.445312 -1.0000005 -1 -1.0000005 c -0.550781 0 -1 0.4453125 -1 1.0000005 z m -4.660156 2.75 l 0.707031 0.707031 c 0.253907 0.253906 0.621094 0.355469 0.96875 0.261719 c 0.34375 -0.09375 0.613281 -0.363282 0.707031 -0.707032 c 0.089844 -0.347656 -0.007812 -0.714844 -0.261718 -0.96875 l -0.707032 -0.707031 c -0.253906 -0.253906 -0.621093 -0.351563 -0.964843 -0.257813 c -0.347657 0.089844 -0.617188 0.359376 -0.710938 0.707032 c -0.089843 0.34375 0.007813 0.714844 0.261719 0.964844 z m -1.347656 5.242187 h 1 c 0.550781 0 1 -0.445313 1 -1 c 0 -0.550781 -0.449219 -1 -1 -1 h -1 c -0.554688 0 -1.00000025 0.449219 -1.00000025 1 c 0 0.554687 0.44531225 1 1.00000025 1 z m 2.753906 4.664063 l 0.707031 -0.707032 c 0.390625 -0.390625 0.390625 -1.027344 0 -1.414062 c -0.390625 -0.390625 -1.027343 -0.390625 -1.414062 0 l -0.710938 0.707031 c -0.386719 0.390625 -0.386719 1.023437 0 1.414063 c 0.390625 0.390624 1.027344 0.390624 1.417969 0 z m 5.242188 1.347656 v -1 c 0 -0.554688 -0.449219 -1 -1 -1 c -0.554688 0 -1 0.445312 -1 1 v 1 c 0 0.550781 0.445312 1 1 1 c 0.550781 0 1 -0.449219 1 -1 z m 4.660156 -2.753906 l -0.707032 -0.707032 c -0.253906 -0.253906 -0.621093 -0.351562 -0.96875 -0.261718 c -0.34375 0.09375 -0.613281 0.363281 -0.707031 0.710937 c -0.09375 0.34375 0.007813 0.710937 0.261719 0.964844 l 0.707031 0.707031 c 0.25 0.253906 0.621094 0.351562 0.964844 0.261719 c 0.347656 -0.09375 0.617187 -0.363281 0.707031 -0.707031 c 0.09375 -0.347657 -0.003906 -0.714844 -0.257812 -0.96875 z M 8 10 c -1.117188 0 -2 -0.882812 -2 -2 s 0.882812 -2 2 -2 s 2 0.882812 2 2 s -0.882812 2 -2 2 z m 0 -6 c -2.207031 0 -4 1.792969 -4 4 s 1.792969 4 4 4 s 4 -1.792969 4 -4 s -1.792969 -4 -4 -4 z",
};

const STATUS = { listening: "Listening", waiting: "Waiting", thinking: "Thinking", speaking: "Speaking" };

// What each state asks of the ring. The drawn ring eases toward these, so changes never jump.
//   radius: base radius (1 = resting); width: stroke in CSS px; alpha: ring opacity;
//   breathe: slow scale swing; wobble: edge movement; arc: how much of the thinking sweep shows.
const TARGETS = {
  listening: { radius: 0.96, width: 3.0, alpha: 0.92, breathe: 0.000, wobble: 0, arc: 0 },
  waiting:   { radius: 0.92, width: 2.0, alpha: 0.42, breathe: 0.022, wobble: 0, arc: 0 },
  thinking:  { radius: 0.88, width: 2.0, alpha: 0.16, breathe: 0.010, wobble: 0, arc: 1 },
  speaking:  { radius: 0.96, width: 3.0, alpha: 0.92, breathe: 0.000, wobble: 0, arc: 0 },
};

const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const canvas = document.getElementById("ring");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const levelRow = document.getElementById("level-row");
const levelInput = document.getElementById("level");
const autoInput = document.getElementById("auto");

let state = "listening";
const shown = { ...TARGETS.listening };
let level = 0;        // smoothed level driving the ring, 0..1
let ripples = [];     // speaking: soft rings that leave Mei's voice
let lastRipple = 0;
let lastPeak = 0;

// ---- Simulated voices ------------------------------------------------------------------------

// A voice-like envelope: syllables of ~200 ms in words, words in phrases, pauses between phrases.
// Deterministic enough to feel like speech, random enough not to loop visibly.
function makeVoice(syllableRate, phraseLength, pause) {
  let bumps = [];
  let next = 0;
  function schedule(now) {
    while (next < now + 2) {
      const words = 3 + Math.floor(Math.random() * phraseLength);
      let t = next;
      for (let w = 0; w < words; w++) {
        const syllables = 1 + Math.floor(Math.random() * 3);
        for (let s = 0; s < syllables; s++) {
          bumps.push({ t, a: 0.45 + Math.random() * 0.55, d: 0.07 + Math.random() * 0.05 });
          t += 1 / syllableRate * (0.8 + Math.random() * 0.4);
        }
        t += 0.06 + Math.random() * 0.12;  // between words
      }
      next = t + pause * (0.6 + Math.random() * 0.8);
    }
    bumps = bumps.filter((b) => b.t > now - 1);
  }
  return function at(now) {
    schedule(now);
    let v = 0;
    for (const b of bumps) {
      const x = (now - b.t) / b.d;
      v = Math.max(v, b.a * Math.exp(-x * x));
    }
    return Math.min(1, v + Math.random() * 0.03);
  };
}
const personVoice = makeVoice(4.5, 6, 1.4);
const meiVoice = makeVoice(5.0, 8, 0.7);

// ---- Drawing ---------------------------------------------------------------------------------

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function foreground() {
  return getComputedStyle(document.documentElement).getPropertyValue("--fg").trim();
}

function approach(current, target, dt, seconds) {
  return current + (target - current) * (1 - Math.exp(-dt / seconds));
}

// A closed ring whose edge moves with a few slow, low harmonics: soft, never jittery.
function ringPath(cx, cy, r, wobble, t) {
  const steps = 160;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * Math.PI * 2;
    const edge = wobble * (
      0.55 * Math.sin(2 * a + t * 1.3) +
      0.30 * Math.sin(3 * a - t * 1.7 + 1.1) +
      0.15 * Math.sin(5 * a + t * 2.3 + 2.0));
    const rr = r * (1 + edge);
    const x = cx + rr * Math.cos(a);
    const y = cy + rr * Math.sin(a);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

let previous = performance.now();
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - previous) / 1000);
  previous = nowMs;
  const t = nowMs / 1000;
  const still = reducedMotion.matches;

  // The level: the person's voice when listening, Mei's when speaking. Fast attack, slow
  // release, as a level meter moves.
  let raw = 0;
  if (state === "listening") raw = autoInput.checked ? personVoice(t) : Number(levelInput.value);
  else if (state === "speaking") raw = meiVoice(t);
  level = approach(level, raw, dt, raw > level ? 0.06 : 0.22);
  if (state === "listening" && autoInput.checked) levelInput.value = level.toFixed(2);

  const target = { ...TARGETS[state] };
  if (state === "listening") {
    target.radius += 0.10 * level;
    target.width += 2.5 * level;
    target.wobble = 0.035 * level;
  } else if (state === "speaking") {
    target.radius += 0.05 * level;
    target.width += 3.5 * level;
  }
  for (const key of Object.keys(shown)) {
    // Size follows the voice quickly; the character of a state (opacity, sweep) changes slowly.
    const pace = key === "radius" || key === "width" || key === "wobble" ? 0.09 : 0.45;
    shown[key] = approach(shown[key], target[key], dt, pace);
  }

  // Speaking: a soft ring leaves on each stressed syllable, at most every 450 ms.
  if (state === "speaking" && !still && level > 0.55 && level > lastPeak && t - lastRipple > 0.45) {
    ripples.push({ born: t, strength: level });
    lastRipple = t;
  }
  lastPeak = level;

  const rect = canvas.getBoundingClientRect();
  const size = rect.width;
  const cx = size / 2;
  const cy = size / 2;
  const base = size * 0.30;
  const fg = foreground();
  ctx.clearRect(0, 0, size, size);
  ctx.strokeStyle = fg;
  ctx.lineCap = "round";

  // Ripples
  const life = 1.8;
  ripples = ripples.filter((r) => t - r.born < life);
  for (const r of ripples) {
    const p = (t - r.born) / life;
    const eased = 1 - Math.pow(1 - p, 3);
    ctx.globalAlpha = 0.22 * r.strength * (1 - p);
    ctx.lineWidth = 1.5;
    ringPath(cx, cy, base * shown.radius * (1 + 0.55 * eased), 0, t);
    ctx.stroke();
  }

  // The ring
  const breathe = still ? 0 : shown.breathe * Math.sin(t * Math.PI * 2 / 5);
  const r = base * (shown.radius + breathe);
  ctx.globalAlpha = shown.alpha;
  ctx.lineWidth = shown.width;
  ringPath(cx, cy, r, still ? 0 : shown.wobble, t);
  ctx.stroke();

  // Thinking: one bright arc travels the ring, easing along rather than spinning at a fixed rate.
  if (shown.arc > 0.01) {
    const turn = t / 2.6;
    const phase = turn - Math.floor(turn);
    const start = still ? -Math.PI / 2
      : -Math.PI / 2 + (Math.floor(turn) + phase - Math.sin(phase * Math.PI * 2) / (Math.PI * 2) * 0.35) * Math.PI * 2;
    const length = Math.PI * (0.45 + 0.15 * Math.sin(t * 1.1));
    const segments = 28;
    ctx.lineWidth = 2.5;
    for (let i = 0; i < segments; i++) {
      const a0 = start + (i / segments) * length;
      const a1 = start + ((i + 1) / segments) * length + 0.002;
      ctx.globalAlpha = shown.arc * 0.9 * Math.pow((i + 1) / segments, 1.6);  // a soft tail
      ctx.beginPath();
      ctx.arc(cx, cy, r, a0, a1);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}

// ---- Controls --------------------------------------------------------------------------------

function setState(next) {
  if (next === state) return;
  state = next;
  if (state !== "speaking") ripples = [];
  for (const b of document.querySelectorAll(".segmented button")) {
    b.setAttribute("aria-pressed", String(b.dataset.state === state));
  }
  levelRow.classList.toggle("shown", state === "listening");
  statusEl.classList.add("fading");
  setTimeout(() => {
    statusEl.textContent = STATUS[state];
    statusEl.classList.remove("fading");
  }, 180);
}

function currentTheme() {
  const set = document.documentElement.dataset.theme;
  if (set) return set;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function showThemeIcon() {
  const dark = currentTheme() === "dark";
  const button = document.getElementById("theme");
  document.getElementById("theme-icon").innerHTML = `<path d="${dark ? ICONS.sun : ICONS.moon}"/>`;
  button.setAttribute("aria-label", dark ? "Switch to light appearance" : "Switch to dark appearance");
}

document.getElementById("theme").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("live-ring-theme", next); } catch (e) { /* storage may be off */ }
  showThemeIcon();
});

for (const b of document.querySelectorAll(".segmented button")) {
  b.addEventListener("click", () => setState(b.dataset.state));
}
autoInput.addEventListener("change", () => { levelInput.disabled = autoInput.checked; });
document.addEventListener("keydown", (e) => {
  const keys = { "1": "listening", "2": "waiting", "3": "thinking", "4": "speaking" };
  if (keys[e.key] && !(e.target instanceof HTMLInputElement)) setState(keys[e.key]);
});

try {
  const saved = localStorage.getItem("live-ring-theme");
  if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
} catch (e) { /* storage may be off */ }
showThemeIcon();
levelRow.classList.add("shown");
window.addEventListener("resize", resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
